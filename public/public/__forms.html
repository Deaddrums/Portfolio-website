<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Forms</title>
</head>
<body>

<!--
    Dit bestand is alleen voor Netlify. Netlify leest het tijdens de deploy om te weten
    welke formulieren en velden er zijn. Bezoekers zien dit nooit.
    De namen moeten exact overeenkomen met het formulier in ContactSectionPortfolio.jsx.
-->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input type="text" name="bot-field" />
</form>

</body>
</html>
```
De veldnamen (`name`, `email`, `message`, `bot-field`) en de formuliernaam (`contact`) moeten exact overeenkomen met het formulier in de JSX. Voeg je later een veld toe aan het formulier, voeg het dan ook hier toe.
